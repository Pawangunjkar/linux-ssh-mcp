# Smithery.ai configuration — https://smithery.ai/docs/build/publish
# Submit this repo at https://smithery.ai after publishing to PyPI

startCommand:
  type: stdio
  configSchema:
    type: object
    properties:
      SSH_HOST:
        type: string
        description: Remote Linux server hostname or IP address
      SSH_PORT:
        type: string
        description: SSH port (default 22)
      SSH_USERNAME:
        type: string
        description: SSH username
      SSH_PASSWORD:
        type: string
        description: SSH password (optional if using SSH key)
      SSH_KEY_PATH:
        type: string
        description: Absolute path to SSH private key file
    required: []
  commandFunction: |-
    (config) => ({
      command: 'uvx',
      args: ['linux-ssh-mcp'],
      env: Object.fromEntries(
        Object.entries(config).filter(([_, v]) => v != null && v !== '')
      )
    })
  exampleConfig:
    SSH_HOST: "192.168.1.100"
    SSH_PORT: "22"
    SSH_USERNAME: "ubuntu"
