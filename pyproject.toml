[project]
name = "linux-ssh-mcp"
version = "1.0.0"
description = "MCP server for SSH operations on remote Linux machines — 50+ tools for file management, system monitoring, Docker, networking, and more"
requires-python = ">=3.10"
authors = [
    { name = "Pawan Gunjkar", email = "pawangunjkar@gamil.com" }
]
readme = "README.md"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.0.0",
    "paramiko>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
